services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 8080:8080
    volumes:
      - .:/app
    networks:
      - default
  db:
    image: postgres:18
    container_name: narou-postgres-db
    ports:
      - 5432:5432
    volumes:
      - db-store:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - default
volumes:
  db-store:
networks:
  default:
    driver: bridge
